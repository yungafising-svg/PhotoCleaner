name: PhotoCleaner
options:
  bundleIdPrefix: com.egor
  deploymentTarget:
    iOS: "17.0"
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Чистка фото"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "Приложение анализирует фото на телефоне, чтобы найти дубликаты и неудачные кадры. Ничего не отправляется в интернет."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egor.photocleaner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
